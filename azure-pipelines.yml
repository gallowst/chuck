# Build a Docker image 
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

schedules:
- cron: "0 23 * * 0"
  displayName: "Weekly Sunday build"
  branches:
    include:
    - main
  always: "true"
  
trigger:
- main

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'
  imageName: 'gallows/chuck'
  DOCKER_BUILDKIT: 1
  trivyVersion: '0.70.0'

stages:
- stage: Build
  displayName: Build image
  jobs:  
  - job: Build
    displayName: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:

    - task: Docker@2
      displayName: Login
      inputs:
        containerRegistry: 'dockerhub'
        command: 'login'
    
    - task: Docker@2
      displayName: Build the Docker image
      inputs:
        repository: '$(imageName)'
        command: build
        dockerfile: '**/Dockerfile'
        tags: |
          $(tag)
          latest

    - task: CmdLine@2
      displayName: Scan
      inputs:
        script: |
          script: |
            echo "##[group]Starting Trivy Checks"
            echo "##[debug]Downloading Trivy"
            wget https://github.com/aquasecurity/trivy/releases/download/v$(trivyVersion)/trivy_$(trivyVersion)_Linux-64bit.tar.gz
            echo "##[debug]Extracting archive"
            tar xvzf trivy_$(trivyVersion)_Linux-64bit.tar.gz
            echo "##[section]Running Trivy scan"
            $(System.DefaultWorkingDirectory)/trivy image --severity HIGH,CRITICAL --format sarif --output trivy.sarif $(imageName)
            echo "##[endgroup]"

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: 'trivy.sarif'
        artifactName: 'CodeAnalysisLogs'
        publishLocation: 'Container'
      displayName: 'Publish CodeAnalysisLogs Artefact'

    - task: Docker@2
      displayName: Push the tagged image
      inputs:
        containerRegistry: 'dockerhub'
        repository: '$(imageName)'
        command: 'push'
        tags: |
          $(Build.BuildId)
          latest
